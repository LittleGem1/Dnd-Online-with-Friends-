<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DnD – Gemeinsame Musik</title><style>*{box-sizing:border-box}body{margin:0;background:#191513;color:#f1e0c1;font:17px Georgia,serif;display:grid;place-items:center;min-height:100vh}main{width:min(92vw,460px);padding:28px;border:1px solid #a98754;background:#29231e;border-radius:10px}button{background:#4b3826;color:#ffe5b2;padding:12px;border:1px solid #ae8a52;border-radius:5px;cursor:pointer}input{width:100%;accent-color:#d4af72}p{line-height:1.5;color:#d0c1aa}h1{color:#e6c28a;font-size:24px}small{color:#c4b398}</style><main><h1>♫ DnD – Gemeinsame Musik</h1><p id="track">Warte auf den DM …</p><button id="enable">Ton aktivieren</button><p id="status" role="status">Klicke einmal, um die Wiedergabe zu erlauben.</p><label>Deine Gesamtlautstärke: <output id="v">70 %</output><input id="volume" type="range" min="0" max="100" value="70"></label><small>Der DM bestimmt das Lied und die Wiedergabe. Deine Lautstärke beeinflusst niemanden sonst. Dieses Fenster ist nur für den Musiktest; das eigentliche Online-Spiel folgt später.</small></main><script>
const $=id=>document.getElementById(id), audio=new Audio(), room=location.pathname.split('/').pop();let enabled=false,current='',latest=null, busy=false;try{$('volume').value=JSON.parse(localStorage.getItem('dnd:volume'))??70}catch{}function volume(){audio.volume=Number($('volume').value)/100;$('v').value=$('volume').value+' %';try{localStorage.setItem('dnd:volume',JSON.stringify(Number($('volume').value)))}catch{}}volume();$('volume').oninput=volume;
function seek(s){if(!Number.isFinite(audio.duration)||audio.duration<=0)return;let n=s.pos+(s.mode==='playing'?Math.max(0,s.now-s.at)/1000:0);if(s.loop)n%=audio.duration;else n=Math.min(n,audio.duration);if(Math.abs(audio.currentTime-n)>1.1)audio.currentTime=n;}
async function apply(s){latest=s;$('track').textContent=s.track?.name||'Warte auf den DM …';if(!s.track||s.mode==='stopped'){audio.pause();if(audio.currentTime)try{audio.currentTime=0}catch{}$('status').textContent='Gestoppt';return}if(!enabled)return;const next=s.track.id+'|'+s.track.url;if(current!==next){current=next;audio.src=s.track.url}audio.loop=s.loop;seek(s);if(s.mode==='paused'){audio.pause();$('status').textContent='Vom DM pausiert';return}if(!s.loop&&Number.isFinite(audio.duration)&&s.pos+(s.now-s.at)/1000>=audio.duration){audio.pause();$('status').textContent='Lied beendet';return}try{if(audio.paused)await audio.play();$('status').textContent='Wird abgespielt';$('enable').hidden=true}catch(e){$('status').textContent='Ton erneut aktivieren oder Audio-Link prüfen.';$('enable').hidden=false}}
audio.addEventListener('loadedmetadata',()=>{if(latest)seek(latest)});async function poll(){if(busy)return;busy=true;try{let r=await fetch('/api/music/'+room+'/state',{cache:'no-store'});if(!r.ok){audio.pause();$('status').textContent='Musiksession beendet oder nicht erreichbar.';return}await apply(await r.json())}catch{audio.pause();$('status').textContent='Verbindung verloren – erneuter Versuch …'}finally{busy=false}}$('enable').onclick=()=>{enabled=true;if(latest)apply(latest);else poll();$('enable').hidden=true};setInterval(poll,1000);poll();
</script></html>
